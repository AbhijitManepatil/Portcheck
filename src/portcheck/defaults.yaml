# Built-in defaults. Override any key in <root>/portcheck.yaml.
target:
  # Both values were looked up on 2026-11-11 and are kept on the same ROCm release.
  # They were confirmed to exist; neither was pulled, installed or run on an AMD GPU.
  # Confirm they suit your GPU and driver, or override them in portcheck.yaml
  # (docs/RELEASE_TEST.md, step 2).
  #
  # rocm_image. Source: https://hub.docker.com/r/rocm/pytorch/tags (registry API:
  # tag last updated 2026-08-27, digest sha256:bbdaba66029f...).
  rocm_image: "rocm/pytorch:rocm10.0_ubuntu24.04_py3.12_pytorch_release_2.13.0"
  # torch_index_url. Source: https://download.pytorch.org/whl/rocm10.0/torch/ which
  # lists torch 2.15.0+rocm10.0 wheels for CPython 3.11 to 3.15. This is the newest
  # stable ROCm index that holds torch wheels: the rocm10.1 index exists but had
  # ROCm torch wheels only under nightly/ on that date.
  torch_index_url: "https://download.pytorch.org/whl/rocm10.0"
parity:
  # Initial defaults, calibrated by a human during the release test.
  noise_multiplier: 3.0
  min_cosine: 0.999
  min_top1_agreement: 0.99
  max_abs_diff_floor:
    float32: 0.001
    float16: 0.05
    bfloat16: 0.05
bench:
  warmup_batches: 2
  measured_batches: 5
scan:
  exclude: [".git", ".venv", "node_modules", ".portcheck", "__pycache__"]
  max_file_bytes: 1000000
